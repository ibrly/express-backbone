version: "3.8"
services:
  db:
    image: 'mysql'
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    env_file:
      - env/db.env
    ports:
      - '6603:3306'
  backend:
    build: ./app
    ports:
      - '1000:1000'
    volumes:
      - ./logs:/app/logs
      - ./app:/app
    env_file:
      - ./env/app.env
    depends_on:
      - db
