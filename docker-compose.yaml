version: "3.8"
services:
  db:
    image: 'mysql'
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    env_file:
      - env/mysql.env
    ports:
      - '6603:3306'
  backend:
    build: ./backend
    ports:
      - '1337:1337'
    volumes:
      - ./logs:/app/logs
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./env/backend.env
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app/src
    stdin_open: true
    tty: true
    depends_on:
      - backend
